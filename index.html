<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #fff;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #10a37f;
            padding: 16px;
            overflow-y: auto;
            border-right: 1px solid #d9d9e3;
        }
        .new-chat {
            background: #fff;
            border: 1px solid #d9d9e3;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            color: #0d0d0d;
        }
        .chat-history {
            color: #ececf1;
        }
        .chat-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fff;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.bot .message-content {
            background: #f7f7f8;
            color: #0d0d0d;
        }
        .message.user .message-content {
            background: #10a37f;
            color: #fff;
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid #d9d9e3;
            background: #fff;
        }
        .input-wrapper {
            display: flex;
            gap: 12px;
        }
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d9d9e3;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            max-height: 200px;
        }
        button {
            padding: 10px 20px;
            background: #10a37f;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: #0d9c6f;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="new-chat">+ New Chat</div>
        <div class="chat-history">
            <div class="chat-item">Chat 1</div>
            <div class="chat-item">Chat 2</div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Send a message..."></textarea>
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Simulate bot response
            setTimeout(() => {
                addMessage('This is a demo response. To use real AI, connect an API.', 'bot');
            }, 500);
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
